<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <title>Poring Fix</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
    .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(680px,100%);background:white;border-radius:24px;padding:32px;box-shadow:0 12px 40px #0001;text-align:center}
    .logo{width:88px;height:88px;margin:auto auto 18px}
    h1{margin:0 0 10px;font-size:30px}p{color:#6b7280;line-height:1.6}
    .btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:14px;background:#111827;color:white;text-decoration:none;font-weight:700}
    .status{margin-top:20px;font-size:13px;color:#6b7280}
  </style>
</head>
<body>
  <main class="app"><section class="card">
    <img class="logo" src="/icon.svg" alt="">
    <h1>Poring Fix</h1>
    <p>เว็บแอปของคุณพร้อมใช้งานบนมือถือ และสามารถติดตั้งเป็นแอปได้</p>
    <a class="btn" href="/repair">เริ่มใช้งาน</a>
    <div class="status" id="status">กำลังเตรียมระบบ…</div>
  </section></main>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
document.getElementById("status").textContent =
  "PWA พร้อมติดตั้ง • ทำงานออฟไลน์ได้สำหรับไฟล์ที่แคชไว้";
</script>
</body></html>
